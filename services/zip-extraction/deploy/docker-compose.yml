# docker-compose for local development (FR-15.2 / Q5 of requirements).
# LocalStack provides SQS / S3 / DynamoDB / STS emulation; the service container
# is built from the local Dockerfile and runs against LocalStack via
# AWS_ENDPOINT_URL.
#
# Bring up:  docker compose -f deploy/docker-compose.yml up -d
#            (the `bootstrap` service auto-seeds LocalStack — no separate
#             `make bootstrap` step needed; from this dir, `cd deploy &&
#             docker compose up -d` also works)
# Tear down: docker compose -f deploy/docker-compose.yml down  (add -v to wipe state)

services:
  localstack:
    container_name: localstack-zip-extraction-service
    image: localstack/localstack:3.7
    # TODO(security): pin by digest for production-parity per SECURITY-10:
    # image: localstack/localstack@sha256:<digest>
    ports:
      # Host port 4568 (not the LocalStack default 4566) so this stack can run
      # alongside the sibling demos on one machine without a clash:
      #   classification → 4566, office-convert → 4567, zip-extraction → 4568.
      # The container still serves 4566; only the host publish moves. Host-side
      # tooling (make bootstrap/run, the test harness) targets localhost:4568.
      - "127.0.0.1:4568:4566"
    environment:
      SERVICES: sqs,s3,dynamodb,sts
      DEBUG: "0"
      AWS_DEFAULT_REGION: eu-west-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 5s

  # Auto-seed LocalStack with the SQS queue+DLQ, S3 buckets, and DynamoDB table
  # the service expects (runs deploy/bootstrap-localstack.sh inside an aws-cli
  # container against the in-network LocalStack). Runs once and exits; the
  # service waits for it to complete. This is what makes a plain
  # `docker compose up -d` a single working command (no `make bootstrap`).
  bootstrap:
    container_name: zip-extraction-bootstrap
    image: amazon/aws-cli:2.17.0
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
      # In-network endpoint (not the host-published 4568) — the script defaults
      # to the host port, so override it for the container network.
      AWS_ENDPOINT_URL: http://localstack:4566
      STAGING_BUCKET: doc-uploader-staging-local
      SOURCE_BUCKET: doc-uploader-uploads-local
      QUEUE_NAME: zip-extraction-queue
      DLQ_NAME: zip-extraction-dlq
      DYNAMO_TABLE: pipeline_files
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes:
      - ./bootstrap-localstack.sh:/bootstrap.sh:ro
    restart: "no"

  zip-extraction:
    container_name: zip-extraction-service
    # Pin an explicit, repo-owned image name so a local build produces a stable,
    # namespaced tag (not the compose default `deploy_zip-extraction`) and never
    # collides with sibling repos' images. Sibling stacks (e.g. the
    # classification pipeline) consume this via an explicit retag, not by name.
    image: zip-extraction-service:dev
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      localstack:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    environment:
      AWS_REGION: eu-west-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      QUEUE_URL: http://localstack:4566/000000000000/zip-extraction-queue
      STAGING_BUCKET: doc-uploader-staging-local
      DYNAMO_TABLE: pipeline_files
      LOG_FORMAT: console
      LOG_LEVEL: debug
      HTTP_PORT: "8080"
      SSE_MODE: SSE-S3
      # Wire the per-child classification hop to the classification-service
      # demo UI, which runs from a separate compose stack on the host. We
      # reach it via host.docker.internal (extra_hosts adds the Linux gateway
      # mapping; on Docker Desktop the alias is built in). Override or unset
      # these to disable classification.
      CLASSIFICATION_URL: http://host.docker.internal:3000
      CLASSIFICATION_DEFAULT_WORKSPACE: wks-ui-001
      CONFIG_PATH: /etc/zip-extraction/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Host port 8085 (not 8080) so it doesn't clash with office-convert's
      # 8080 when both demo stacks run on one machine. The container still
      # listens on 8080 (HTTP_PORT below); only the host publish moves.
      - "127.0.0.1:8085:8080"
    volumes:
      - ./config-local.yaml:/etc/zip-extraction/config.yaml:ro
    # Drain window matches the application's gracefulShutdownTimeoutSec + 20s margin (NFR-Z-022).
    stop_grace_period: 270s
